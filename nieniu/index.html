<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>捏捏泡泡 · 打工人的三十秒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bgA:#e8f2ec;--bgB:#d4e6dc;--ink:#2f3d35;--dim:#7d9086;
  --accent:#5b9e85;--accent2:#e5735f;
  --f-disp:"ZCOOL XiaoWei","STKaiti","Kaiti SC","KaiTi",serif;
  --f-body:"Noto Serif SC","Songti SC",serif;
  --f-num:"Cormorant Garamond","Georgia",serif;
  --bs:52px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--f-body);color:var(--ink);overflow:hidden;user-select:none;
  background:linear-gradient(160deg,var(--bgA),var(--bgB) 75%)}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
#hud .logo{font-family:var(--f-disp);font-size:21px;letter-spacing:4px}
.scorebox{text-align:center;line-height:1.1}
.scorebox .lbl{font-size:10px;letter-spacing:2px;color:var(--dim)}
.scorebox .val{font-family:var(--f-num);font-size:20px;font-weight:700;color:var(--accent)}
#combo{font-family:var(--f-disp);font-size:22px;color:var(--accent2);letter-spacing:2px;
  opacity:0;transform:scale(.6);transition:opacity .18s,transform .18s}
#combo.on{opacity:1;transform:scale(1)}
#combo.hot{animation:hot .5s}
@keyframes hot{30%{transform:scale(1.5) rotate(-4deg)}}
#hud .spacer{flex:1}
.hbtn{background:rgba(255,255,255,.55);border:1px solid rgba(47,61,53,.22);color:var(--ink);
  border-radius:20px;padding:5px 13px;font-size:12.5px;letter-spacing:2px;cursor:pointer;transition:all .15s}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hbtn.sel{background:var(--accent);border-color:var(--accent);color:#fff}
#sheet{flex:1;min-height:0;display:grid;justify-content:center;align-content:start;
  gap:6px;padding:6px 10px 16px;overflow:hidden;touch-action:none;cursor:pointer}
.bubble{width:var(--bs);height:var(--bs);border-radius:50%;position:relative;flex:none;
  background:radial-gradient(circle at 32% 28%,#ffffff 0%,rgba(255,255,255,.9) 12%,#dcefe5 38%,#bcd9cb 72%,#a5c8b8 100%);
  box-shadow:inset -3px -5px 9px rgba(120,150,135,.45),inset 3px 5px 7px rgba(255,255,255,.85),0 2px 4px rgba(120,150,135,.25);
  transition:transform .1s,box-shadow .25s,background .25s;animation:birth .3s ease both}
@keyframes birth{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.bubble:hover{transform:scale(1.07)}
.bubble.popped{background:radial-gradient(circle at 50% 55%,#c3d8cd 0%,#b0c9bb 60%,#9fbcab 100%);
  box-shadow:inset 2px 4px 8px rgba(90,120,105,.5);transform:scale(.9);cursor:default}
.bubble.pop{animation:popAnim .28s ease}
@keyframes popAnim{35%{transform:scale(1.28)}100%{transform:scale(.9)}}
.bubble.regrow{animation:regrow .45s ease both}
@keyframes regrow{0%{transform:scale(.88)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.pt{position:fixed;width:7px;height:7px;border-radius:50%;background:#8fc0ab;pointer-events:none;z-index:40;
  animation:ptFly .5s ease-out forwards}
@keyframes ptFly{to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}
#banner{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-3deg);z-index:60;
  font-family:var(--f-disp);font-size:30px;letter-spacing:6px;color:var(--ink);text-align:center;
  background:rgba(255,255,255,.9);border:2px solid var(--accent);border-radius:14px;padding:18px 34px;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#banner.on{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}
#banner small{display:block;font-size:13px;color:var(--dim);letter-spacing:3px;margin-top:8px}
@media (max-width:560px){:root{--bs:44px}#hud .logo{font-size:18px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="logo">捏捏泡泡</span>
    <div class="scorebox"><div class="lbl">本张剩余</div><div class="val" id="leftN">0</div></div>
    <div class="scorebox"><div class="lbl">累计捏爆</div><div class="val" id="totalN">0</div></div>
    <span id="combo">×3 舒服</span>
    <div class="spacer"></div>
    <button class="hbtn sel" id="btnMode">整张模式</button>
    <button class="hbtn" id="btnSkin">音色 · 泡泡纸</button>
    <button class="hbtn" id="btnMute">音效 开</button>
  </div>
  <div id="sheet"></div>
</div>
<div id="banner"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const sheet=$('#sheet');
let mode='sheet';           // sheet=整张 | endless=无限回涨
let skin=0;                 // 0 泡泡纸 1 木鱼 2 气泡水
const SKIN_NAMES=['泡泡纸','木鱼','气泡水'];
let total=0,left=0,combo=0,comboT=null,sheetStart=0,sheets=0;
let muted=localStorage.getItem('nieniu_mute')==='1';

/* ---------- 音效 ---------- */
let actx=null,noiseBuf=null;
function ac(){
  if(!actx){
    actx=new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf=actx.createBuffer(1,actx.sampleRate*0.1,actx.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  return actx;
}
function popSound(){
  if(muted)return;
  try{
    const a=ac(),t=a.currentTime;
    if(skin===0){
      const n=a.createBufferSource();n.buffer=noiseBuf;
      const nf=a.createBiquadFilter();nf.type='bandpass';nf.frequency.value=1400+Math.random()*1600;nf.Q.value=1.2;
      const ng=a.createGain();ng.gain.setValueAtTime(.22,t);ng.gain.exponentialRampToValueAtTime(.001,t+.07);
      n.connect(nf).connect(ng).connect(a.destination);n.start(t);n.stop(t+.08);
      const o=a.createOscillator();o.type='sine';
      o.frequency.setValueAtTime(500+Math.random()*650,t);
      o.frequency.exponentialRampToValueAtTime(180,t+.09);
      const g=a.createGain();g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);
      o.connect(g).connect(a.destination);o.start(t);o.stop(t+.11);
    }else if(skin===1){
      const o=a.createOscillator();o.type='sine';
      o.frequency.setValueAtTime(175,t);o.frequency.exponentialRampToValueAtTime(140,t+.16);
      const g=a.createGain();g.gain.setValueAtTime(.34,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);
      o.connect(g).connect(a.destination);o.start(t);o.stop(t+.2);
      const c=a.createOscillator();c.type='square';c.frequency.value=880;
      const cg=a.createGain();cg.gain.setValueAtTime(.05,t);cg.gain.exponentialRampToValueAtTime(.001,t+.02);
      c.connect(cg).connect(a.destination);c.start(t);c.stop(t+.03);
    }else{
      const o=a.createOscillator();o.type='sine';
      o.frequency.setValueAtTime(260+Math.random()*90,t);
      o.frequency.exponentialRampToValueAtTime(560+Math.random()*160,t+.12);
      const g=a.createGain();g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
      o.connect(g).connect(a.destination);o.start(t);o.stop(t+.18);
    }
  }catch(e){}
}

/* ---------- 铺纸 ---------- */
function buildSheet(){
  sheet.innerHTML='';
  const bs=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bs'));
  const cols=Math.max(4,Math.floor((sheet.clientWidth-20)/(bs+6)));
  const rows=Math.max(5,Math.ceil((sheet.clientHeight-22)/(bs+6)));
  for(let i=0;i<cols*rows;i++){
    const b=document.createElement('div');
    b.className='bubble';
    b.style.animationDelay=(Math.random()*.25)+'s';
    sheet.appendChild(b);
  }
  sheet.style.gridTemplateColumns='repeat('+cols+',var(--bs))';
  left=cols*rows;
  sheetStart=performance.now();
  updateHUD();
}
function updateHUD(){
  left=[...sheet.children].filter(b=>!b.classList.contains('popped')).length;
  $('#leftN').textContent=left;
  $('#totalN').textContent=total;
}

/* ---------- 捏爆 ---------- */
function popBubble(b){
  if(!b||!b.classList||!b.classList.contains('bubble')||b.classList.contains('popped'))return;
  b.classList.remove('regrow');
  b.classList.add('popped','pop');
  setTimeout(()=>b.classList.remove('pop'),300);
  // 粒子
  const r=b.getBoundingClientRect();
  for(let i=0;i<5;i++){
    const p=document.createElement('div');p.className='pt';
    p.style.left=(r.left+r.width/2)+'px';p.style.top=(r.top+r.height/2)+'px';
    const a=Math.random()*Math.PI*2,d=26+Math.random()*34;
    p.style.setProperty('--dx',Math.cos(a)*d+'px');
    p.style.setProperty('--dy',Math.sin(a)*d+'px');
    p.style.background=['#8fc0ab','#a5c8b8','#e5735f','#d9a441'][i%4];
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),520);
  }
  popSound();
  if(navigator.vibrate)navigator.vibrate(12);
  total++;combo++;
  const c=$('#combo');
  if(combo>=3){c.textContent='×'+combo+' 舒服';c.classList.add('on');c.classList.remove('hot');void c.offsetWidth;c.classList.add('hot')}
  clearTimeout(comboT);comboT=setTimeout(()=>{combo=0;c.classList.remove('on')},1100);
  updateHUD();
  if(mode==='endless'){
    setTimeout(()=>{
      if(b.classList.contains('popped')){b.classList.remove('popped');b.classList.add('regrow');setTimeout(()=>b.classList.remove('regrow'),460);updateHUD()}
    },4500+Math.random()*5000);
  }else if(left===0){
    const dur=((performance.now()-sheetStart)/1000).toFixed(1);
    sheets++;
    const bn=$('#banner');
    bn.innerHTML='舒服了 ！<small>整张捏完 · 共 '+total+' 泡 · 耗时 '+dur+' 秒</small>';
    bn.classList.add('on');
    setTimeout(()=>{bn.classList.remove('on');buildSheet()},1900);
  }
}

/* ---------- 按压拖动 ---------- */
let pressing=false;
function elementBubble(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  return el&&el.classList&&el.classList.contains('bubble')?el:null;
}
sheet.addEventListener('pointerdown',e=>{pressing=true;ac();popBubble(elementBubble(e))});
window.addEventListener('pointerup',()=>pressing=false);
sheet.addEventListener('pointermove',e=>{if(pressing)popBubble(elementBubble(e))});

/* ---------- 按钮 ---------- */
$('#btnMode').addEventListener('click',()=>{
  mode=mode==='sheet'?'endless':'sheet';
  $('#btnMode').textContent=mode==='sheet'?'整张模式':'无限回涨';
  $('#btnMode').classList.toggle('sel',mode==='sheet');
  buildSheet();
  if(mode==='endless'){
    const bn=$('#banner');
    bn.innerHTML='无限回涨<small>捏掉的泡泡会慢慢长回来 · 永远捏不完</small>';
    bn.classList.add('on');setTimeout(()=>bn.classList.remove('on'),1700);
  }
});
$('#btnSkin').addEventListener('click',()=>{
  skin=(skin+1)%3;
  $('#btnSkin').textContent='音色 · '+SKIN_NAMES[skin];
  popSound();
});
$('#btnMute').addEventListener('click',()=>{
  muted=!muted;localStorage.setItem('nieniu_mute',muted?'1':'0');
  $('#btnMute').textContent=muted?'音效 关':'音效 开';
});
$('#btnMute').textContent=muted?'音效 关':'音效 开';

let rsT=null;
window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(buildSheet,250)});
buildSheet();
})();
</script>
</body>
</html>
