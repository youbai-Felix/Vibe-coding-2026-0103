    <script>
        // 检查后端服务状态
        async function checkServiceStatus() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            try {
                const response = await fetch(`${API_BASE}/health`, { method: 'GET' });
                if (response.ok) {
                    statusDot.className = 'status-dot online';
                    statusText.textContent = '后端服务在线';
                } else {
                    throw new Error('服务异常');
                }
            } catch {
                statusDot.className = 'status-dot offline';
                statusText.textContent = '后端服务离线';
            }
        }

        // 定期检查服务状态
        checkServiceStatus();
        setInterval(checkServiceStatus, 10000);

        // 主题配色方案
        const themes = {
            youbai: {
                name: '游白·硅基书写',
                background: '#FFFFFF',
                text: '#333333',
                accent: '#1C1C1E',
                border: '#E5E5EA',
                codeBg: '#F2F2F7',
                quoteBg: '#FAFAFA',
                quoteBorder: '#D1D1D6',
                fontFamily: '-apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif',
                baseFontSize: '15px',
                lineHeight: '1.8',
                letterSpacing: '0',
                paragraphMargin: '30px'
            }
        };

        let currentTheme = 'youbai';

        // Markdown 解析器
        async function parseMarkdown(markdown, theme) {
            const t = themes[theme];
            let html = markdown;

            console.log('🔍 Parsing markdown for theme:', theme);
            console.log('📝 Input markdown preview:', markdown.substring(0, 200));

            // 第一步：先处理代码块（在行内代码之前），用占位符保护
            console.log('🔍 处理代码块前...');
            const codeBlocks = [];
            // 匹配代码块，语言名称可以包含空格（如 "plain text"）
            html = html.replace(/```([^\n]*)\n([\s\S]*?)```/g, (match, lang, code) => {
                const fileName = lang.trim() || 'main.py';
                console.log('📝 找到代码块:', fileName);
                const index = codeBlocks.length;
                // 对代码内容进行HTML转义，但保持占位符状态
                const escapedCode = code.trim()
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                // 将代码内容中的换行符替换为<br>，确保空行正确显示
                const displayCode = escapedCode.replace(/\n/g, '<br>');
                // 生成单行HTML，避免被段落处理的split('\n\n')错误分割
                const html = `<section style="margin: 30px 10px;"><div style="background-color: #FFFFFF; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); padding: 4px; overflow: hidden;"><div style="background-color: #1E1E1E; border-radius: 8px; overflow: hidden;"><div style="height: 38px; background-color: #2D2D2D; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;"><div style="display: flex; gap: 8px;"><span style="display: block; width: 12px; height: 12px; border-radius: 50%; background-color: #FF5F56;"></span><span style="display: block; width: 12px; height: 12px; border-radius: 50%; background-color: #FFBD2E;"></span><span style="display: block; width: 12px; height: 12px; border-radius: 50%; background-color: #27C93F;"></span></div><span style="font-family: SF Mono, Consolas, Monaco, monospace; font-size: 12px; color: #8E8E93; letter-spacing: 0.5px;">${fileName}</span></div><div style="padding: 24px 20px; overflow-x: auto;"><code style="display: block; margin: 0; font-family: SF Mono, Consolas, Monaco, monospace; font-size: 14px; color: #E5E5EA; line-height: 1.6;">${displayCode}</code></div></div></div></section>`;
                codeBlocks.push(html);
                console.log('✅ 代码块HTML生成完毕');
                const placeholder = `__CODE_BLOCK_${index}__`;
                console.log('🔍 返回占位符:', placeholder);
                return placeholder;
            });
            console.log('✅ 代码块处理完成，共找到', codeBlocks.length, '个代码块');
            console.log('🔍 代码块处理后HTML包含占位符:', html.includes('__CODE_BLOCK_0__'));

            // 第二步：先处理多行块（提示框、警告框、总结卡片），用占位符保护
            const multiLineBlocks = [];
            html = html.replace(/\[!(tip|warn|summary)(?:\s+title=[^\n]+)?\][\s\S]*?(?=\n\n|\n\[!|\n#|$)/g, (match) => {
                const index = multiLineBlocks.length;
                multiLineBlocks.push(match);
                return `__MULTILINE_BLOCK_${index}__`;
            });
            console.log('✅ 多行块处理完成，共找到', multiLineBlocks.length, '个多行块');

            // 第三步：处理行内代码（在转义HTML之前）- 使用临时对象存储
            const inlineCodes = [];
            html = html.replace(/`([^`]+)`/g, (match, code) => {
                const index = inlineCodes.length;
                inlineCodes.push(code);
                return `«CODE${index}»`;
            });

            // 第四步：转义 HTML
            console.log('🔍 HTML转义前，包含占位符:', html.includes('__CODE_BLOCK_0__'));
            html = html.replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;');
            console.log('🔍 HTML转义后，包含占位符:', html.includes('__CODE_BLOCK_0__'));

            // 第五步：恢复行内代码并应用样式
            html = html.replace(/«CODE(\d+)»/g, (match, index) => {
                const code = inlineCodes[parseInt(index)];
                // 先解码HTML实体，再转义特殊字符
                const decoded = code.replace(/&#x20;/g, ' ').replace(/&#(\d+);/g, (m, n) => String.fromCharCode(n));
                const escapedCode = decoded.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<span style="font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 0.9em; color: #D13438; background-color: #F2F2F7; padding: 2px 6px; border-radius: 4px; margin: 0 2px; letter-spacing: 0;">${escapedCode}</span>`;
            });

            // 第六步：提前恢复代码块和多行块（在其他Markdown处理之前，避免被破坏）
            console.log('🔍 提前恢复代码块，包含占位符:', html.includes('__CODE_BLOCK_0__'));
            codeBlocks.forEach((codeHtml, index) => {
                const placeholder = `__CODE_BLOCK_${index}__`;
                html = html.replace(placeholder, codeHtml);
            });
            console.log('✅ 代码块已提前恢复');

            console.log('🔍 提前恢复多行块，包含占位符:', html.includes('__MULTILINE_BLOCK_'));
            multiLineBlocks.forEach((block) => {
                const placeholder = `__MULTILINE_BLOCK_${multiLineBlocks.indexOf(block)}__`;
                // 提示框
                if (block.match(/^\[!tip\]/)) {
                    const content = block.replace(/^\[!tip\]\s*\n?/, '').trim();
                    const styled = `<section style="margin: 20px 0; padding: 16px; background-color: rgb(246, 248, 250); border-radius: 6px; border-left: 3px solid rgb(0, 122, 255); display: flex; align-items: flex-start;">
<div style="margin-right: 12px; margin-top: 2px; font-size: 16px; line-height: 1;">💡</div>
<div style="flex-grow: 1; font-size: 14.5px; color: rgb(44, 44, 46); line-height: 1.6;">
<strong style="display: block; margin-bottom: 4px; color: rgb(28, 28, 29); font-weight: 600;">提示</strong>
${content}
</div>
</section>`;
                    html = html.replace(placeholder, styled);
                }
                // 警告框
                else if (block.match(/^\[!warn\]/)) {
                    const content = block.replace(/^\[!warn\]\s*\n?/, '').trim();
                    const styled = `<section style="margin: 20px 0; padding: 16px; background-color: rgb(255, 249, 240); border-radius: 6px; border-left: 3px solid rgb(255, 149, 0); display: flex; align-items: flex-start;">
<div style="margin-right: 12px; margin-top: 2px; font-size: 16px; line-height: 1;">⚠️</div>
<div style="flex-grow: 1; font-size: 14.5px; color: rgb(74, 74, 74); line-height: 1.6;">
${content}
</div>
</section>`;
                    html = html.replace(placeholder, styled);
                }
                // 总结卡片 - 使用table布局确保微信兼容
                else if (block.match(/^\[!summary\]/)) {
                    const titleMatch = block.match(/^\[!summary\]\s*title=([^\n]+)\s*\n?/);
                    const title = titleMatch ? titleMatch[1] : '总结';
                    const content = block.replace(/^\[!summary\][^\n]*\n?/, '').trim();
                    const styled = `<table style="width: 100%; margin: 30px 0; border: 1px solid rgb(229, 229, 234); border-radius: 8px; border-collapse: separate; background-color: rgb(255, 255, 255);"><tr><td style="padding: 12px 16px; background-color: rgb(250, 250, 250); border-bottom: 1px dashed rgb(209, 209, 214);"><table style="width: 100%; border-collapse: collapse;"><tr><td style="padding: 0;"><span style="background-color: rgb(52, 199, 89); width: 6px; height: 6px; display: inline-block; border-radius: 50%; margin-right: 8px;"></span><span style="font-family: SF Mono, Consolas, monospace; font-size: 10px; color: rgb(142, 142, 147); letter-spacing: 1px;">EXECUTION_SUMMARY</span></td><td style="padding: 0; text-align: right;"><span style="font-size: 14px; opacity: 0.6;">🧾</span></td></tr></table></td></tr><tr><td style="padding: 20px 16px;"><h4 style="margin: 0 0 12px 0; font-size: 16px; color: rgb(28, 28, 30); font-weight: 600;">${title}</h4><p style="margin: 0; font-size: 14.5px; color: rgb(74, 74, 74); line-height: 1.7;">${content}</p></td></tr><tr><td style="padding: 10px 16px; border-top: 1px solid rgb(242, 242, 247); text-align: right;"><span style="font-family: -apple-system, sans-serif; font-size: 10px; color: rgb(199, 199, 204); letter-spacing: 0.5px; text-transform: uppercase;">Generated by Toolbox</span></td></tr></table>`;
                    html = html.replace(placeholder, styled);
                }
            });
            console.log('✅ 多行块已提前恢复');

            // 标题 - 使用游白·硅基书写风格
            // H1 - 主标题 ROOT
            html = html.replace(/^# (.+)$/gm, (match, title) => {
                return `<div style="margin: 45px 0 40px 0; padding-bottom: 12px; border-bottom: 2px solid #E5E5EA;">
<div><span style="background-color: #1C1C1E; color: rgb(255, 255, 255); font-family: SF Mono, monospace; font-size: 13px; font-weight: bold; padding: 3px 8px; border-radius: 4px; margin-right: 6px;">&gt;_</span><span style="font-family: -apple-system, sans-serif; font-size: 11px; color: rgb(142, 142, 147); letter-spacing: 1.5px; font-weight: 600;">ROOT</span></div>
<div style="margin-top: 2px; font-family: 楷体, Kaiti, serif; font-size: 22px; font-weight: bold; color: rgb(44, 44, 46); letter-spacing: 2px;">${title}</div>
</div>`;
            });

            // H2 - 二级标题 SECTION
            html = html.replace(/^## (.+)$/gm, (match, title) => {
                return `<div style="margin: 45px 0 32px 0; padding-bottom: 8px; border-bottom: 1.5px solid #E5E5EA;">
<div><span style="background-color: #1C1C1E; color: rgb(255, 255, 255); font-family: SF Mono, monospace; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-right: 6px;">&gt;_</span><span style="font-family: -apple-system, sans-serif; font-size: 10px; color: rgb(142, 142, 147); letter-spacing: 1px;">SECTION</span></div>
<div style="margin-top: 2px; font-family: 楷体, Kaiti, serif; font-size: 22px; font-weight: bold; color: rgb(44, 44, 46); letter-spacing: 1.5px;">${title}</div>
</div>`;
            });

            // H3 - 三级标题 NODE
            html = html.replace(/^### (.+)$/gm, (match, title) => {
                return `<div style="margin: 45px 0 24px 0; padding-bottom: 8px; border-bottom: 1.5px solid #E5E5EA;">
<div><span style="background-color: #1C1C1E; color: rgb(255, 255, 255); font-family: SF Mono, monospace; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-right: 6px;">&gt;_</span><span style="font-family: -apple-system, sans-serif; font-size: 10px; color: rgb(142, 142, 147); letter-spacing: 1px;">NODE</span></div>
<div style="margin-top: 2px; font-family: 楷体, Kaiti, serif; font-size: 22px; font-weight: bold; color: rgb(44, 44, 46); letter-spacing: 1px;">${title}</div>
</div>`;
            });

            // H4 - 四级标题 ITEM
            html = html.replace(/^#### (.+)$/gm, (match, title) => {
                return `<div style="margin: 45px 0 20px 0; padding-bottom: 6px; border-bottom: 1px solid #E5E5EA;">
<div><span style="background-color: #1C1C1E; color: rgb(255, 255, 255); font-family: SF Mono, monospace; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 3px; margin-right: 5px;">&gt;_</span><span style="font-family: -apple-system, sans-serif; font-size: 9px; color: rgb(142, 142, 147); letter-spacing: 0.8px;">ITEM</span></div>
<div style="margin-top: 2px; font-family: 楷体, Kaiti, serif; font-size: 22px; font-weight: bold; color: rgb(44, 44, 46); letter-spacing: 1px;">${title}</div>
</div>`;
            });

            // H5 - 五级标题
            html = html.replace(/^##### (.+)$/gm, `<h5 style="font-size: 17px; color: ${t.text}; margin: 28px 0 16px 0; font-weight: 600; font-family: '楷体', 'Kaiti', serif; letter-spacing: 0.5px;">$1</h5>`);

            // H6 - 六级标题
            html = html.replace(/^###### (.+)$/gm, `<h6 style="font-size: 16px; color: ${t.text}; margin: 24px 0 12px 0; font-weight: 500; font-family: '楷体', 'Kaiti', serif; opacity: 0.85;">$1</h6>`);

            // 粗体 - 使用参考样式
            html = html.replace(/\*\*\*(.+?)\*\*\*/g, `<strong><em>$1</em></strong>`);
            html = html.replace(/\*\*(.+?)\*\*/g, `<strong style="font-weight: 600; color: rgb(28, 28, 30); background: linear-gradient(to top, rgb(229, 229, 234) 35%, transparent 35%); padding: 0 2px; border-radius: 1px;">$1</strong>`);
            html = html.replace(/\*(.+?)\*/g, `<em style="font-style: italic;">$1</em>`);
            html = html.replace(/___(.+?)___/g, `<strong><em>$1</em></strong>`);
            html = html.replace(/__(.+?)__/g, `<strong style="font-weight: 600; color: rgb(28, 28, 30); background: linear-gradient(to top, rgb(229, 229, 234) 35%, transparent 35%); padding: 0 2px; border-radius: 1px;">$1</strong>`);
            html = html.replace(/_(.+?)_/g, `<em style="font-style: italic;">$1</em>`);

            // 引用块 - 支持多行引用（包括空行）
            // 收集所有引用块
            const quoteMatches = [];
            let match;
            const quoteRegex = /(?:^&gt; .*$\n?)+/gm;
            while ((match = quoteRegex.exec(html)) !== null) {
                quoteMatches.push(match[0]);
            }

            // 处理每个引用块
            quoteMatches.forEach((quoteBlock) => {
                const lines = quoteBlock.trim().split('\n');
                const content = lines.map(line => line.replace(/^&gt; /, '')).join('<br>');
                const quoteHtml = `<blockquote style="margin: 25px 0; padding: 12px 15px 12px 18px; border-left: 3px solid rgb(209, 209, 214); background-color: rgb(250, 250, 250); border-radius: 0 6px 6px 0;">
<p style="font-family: 楷体, Kaiti, STKaiti, serif; font-size: 16px; color: rgb(74, 74, 74); line-height: 1.7; margin: 0; letter-spacing: 1px;">${content}</p>
</blockquote>`;
                html = html.replace(quoteBlock, quoteHtml);
            });

            // 无序列表 - 使用参考样式（单行HTML，避免微信换行）
            console.log('🔍 处理无序列表前...');
            html = html.replace(/^[*•-] (.+)$/gm, `<div style="display: flex; align-items: baseline;"><span style="color: rgb(0, 122, 255); font-family: SF Mono, Consolas, monospace; font-size: 13px; font-weight: bold; margin-right: 10px; flex-shrink: 0;">&gt;</span><span style="color: rgb(51, 51, 51); line-height: 1.7;">$1</span></div>`);
            console.log('✅ 无序列表处理完成');

            // 有序列表 - 使用参考样式（单行HTML，避免微信换行）
            console.log('🔍 处理有序列表前...');
            html = html.replace(/^\d+\. (.+)$/gm, (match, content) => {
                const num = match.match(/^(\d+)\./)[1];
                const paddedNum = String(num).padStart(2, '0');
                return `<div style="display: flex; align-items: baseline; margin-bottom: 14px;"><span style="font-family: SF Mono, Consolas, monospace; font-size: 11px; color: rgb(28, 28, 30); background-color: rgb(242, 242, 247); padding: 2px 6px; border-radius: 4px; margin-right: 10px; flex-shrink: 0; font-weight: 500;">${paddedNum}</span><span style="color: rgb(51, 51, 51); line-height: 1.7;">${content}</span></div>`;
            });
            console.log('✅ 有序列表处理完成');

            // 链接
            html = html.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, `<a href="$2" style="color: ${t.accent}; text-decoration: underline;">$1</a>`);

            // 图片
            html = html.replace(/!\[([^\]]*)\]\(([^\)]+)\)/g, `<img src="$2" alt="$1" style="max-width: 100%; height: auto; border-radius: 8px; margin: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">`);

            // 分隔线
            html = html.replace(/^---+$/gm, `<hr style="border: none; border-top: 2px solid ${t.border}; margin: 25px 0;">`);
            html = html.replace(/^\*\*\*+$/gm, `<hr style="border: none; border-top: 2px dashed ${t.accent}; margin: 25px 0;">`);

            // 段落处理（保护已生成的HTML块和占位符）
            console.log('🔍 段落处理前，包含代码块section:', html.includes('<section style="margin: 30px'));
            html = html.split('\n\n').map(para => {
                if (!para.trim()) return '';
                // 跳过已经处理过的HTML块（包括代码块section、列表div等）
                if (para.startsWith('<h') || para.startsWith('<blockquote') || para.startsWith('<pre') ||
                    para.startsWith('<hr') || para.startsWith('<section') ||
                    (para.startsWith('<div') && (para.includes('border-bottom') || para.includes('display: flex'))) ||
                    para.startsWith('__MULTILINE_BLOCK_')) {
                    return para;
                }
                const content = para.replace(/\n/g, '<br>');
                return `<p style="margin: ${t.paragraphMargin} 0;"><span style="font-size: ${t.baseFontSize}; line-height: ${t.lineHeight}; color: ${t.text}; text-align: justify; font-family: ${t.fontFamily}; letter-spacing: ${t.letterSpacing}; display: block;">${content}</span></p>`;
            }).join('\n');

            return html;
        }

        // 简单的代码高亮
        function highlightCode(code, theme) {
            const t = themes[theme];
            let result = code;

            // 关键字
            const keywords = ['function', 'const', 'let', 'var', 'if', 'else', 'for', 'while', 'return', 'import', 'export', 'class', 'new', 'this', 'async', 'await', 'try', 'catch', 'throw', 'default', 'from', 'typeof', 'instanceof'];
            keywords.forEach(kw => {
                const regex = new RegExp(`\\b(${kw})\\b`, 'g');
                result = result.replace(regex, `<span style="color: #c678dd;">${kw}</span>`);
            });

            // 字符串
            result = result.replace(/(["'`])(?:(?!\1)[^\\]|\\.)*?\1/g, '<span style="color: #98c379;">$&</span>');

            // 注释
            result = result.replace(/(\/\/.*$)/gm, '<span style="color: #5c6370;">$1</span>');
            result = result.replace(/(\/\*[\s\S]*?\*\/)/g, '<span style="color: #5c6370;">$1</span>');

            // 数字
            result = result.replace(/\b(\d+\.?\d*)\b/g, '<span style="color: #d19a66;">$1</span>');

            // 函数调用
            result = result.replace(/\b([a-zA-Z_]\w*)\s*\(/g, '<span style="color: #61afef;">$1</span>(');

            return result;
        }
