    <script>
        // 检查后端服务状态
        async function checkServiceStatus() {
            const statusDot = document.getElementById('status-dot');

                headingBorderWidth: '2px',
                boldColor: '#2D1F1A',
                boldBg: 'linear-gradient(transparent 60%, #DDEEE0 60%)',
                dashedBold: 'border-bottom: 2px dashed rgba(31,110,67,0.4); padding-bottom: 3px;',
                highlightText: '#1F6E43',
                highlightBgText: '#195C37',
                highlightBg: '#E8F3EB',

            }
        };

        let currentTheme = 'dacongming';

        // Markdown 解析器
        async function parseMarkdown(markdown, theme) {
            const t = themes[theme];
            const boldExtra = t.boldBg ? `background: ${t.boldBg}; padding: 0 4px;` : '';
            const dashedExtra = t.dashedBold || '';
            let html = markdown;

            console.log('🔍 Parsing markdown for theme:', theme);
            console.log('📝 Input markdown preview:', markdown.substring(0, 200));

            // 第一步：先处理代码块（在行内代码之前），用占位符保护
            console.log('🔍 处理代码块前...');
            const codeBlocks = [];
            // 匹配代码块，语言名称可以包含空格（如 "plain text"）
            html = html.replace(/```([^\n]*)\n([\s\S]*?)```/g, (match, lang, code) => {
                const fileName = lang.trim() || 'main.py';
                console.log('📝 找到代码块:', fileName);
                const index = codeBlocks.length;
                // 对代码内容进行HTML转义，并临时替换 * 和 _
                // 对代码内容进行HTML转义
                const escapedCode = code
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                // 将换行符替换为<br>，确保空行正确显示
                const displayCode = escapedCode.replace(/\n/g, '<br>');
                // 使用section包裹，强制微信保持布局
                let codeHtml;
                if (theme === 'chunmu') {
                    codeHtml = `<section style="margin: 24px 0 0 0; background-color: #F5F0E6; border: 1px solid #EBE3D5; border-radius: 6px; padding: 16px; overflow-x: auto;"><section style="display: block; margin: 0; font-family: 'Menlo', Monaco, Consolas, 'Courier New', monospace !important; font-size: 14px; color: #4A3B32; line-height: 1.45;">${displayCode}</section></section>`;
                } else {
                    codeHtml = `<section style="margin: 24px 0 0 0; background-color: ${t.codeBg}; border-radius: ${t.codeBlockRadius}; padding: 20px; overflow-x: auto; box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);"><code style="display: block; margin: 0; font-family: 'Menlo', Monaco, Consolas, 'Courier New', monospace; font-size: 14px; color: ${t.codeBlockText}; line-height: 1.7;">${displayCode}</code></section>`;
                }
                codeBlocks.push(codeHtml);
                console.log('✅ 代码块HTML生成完毕');
                const placeholder = `__CODE_BLOCK_${index}__`;
                console.log('🔍 返回占位符:', placeholder);
                return placeholder;
            });
            console.log('✅ 代码块处理完成，共找到', codeBlocks.length, '个代码块');
            console.log('🔍 代码块处理后HTML包含占位符:', html.includes('__CODE_BLOCK_0__'));

            // 第1.5步：收集卡片块 [!card]（支持内部多段落，遇到分隔线/标题/其他块则终止）
            const cardBlocks = [];
            html = html.replace(/\[!card\]\n([\s\S]*?)\[card\]/g, (match, content) => {
                const index = cardBlocks.length;
                cardBlocks.push(content.trim());
                return `__CARD_BLOCK_${index}__`;
            });

            // 第二步：先处理多行块（提示框、警告框、总结卡片），用占位符保护
            const multiLineBlocks = [];
            html = html.replace(/\[!(tip|warn|summary)(?:\s+title=[^\n]+)?\][\s\S]*?(?=\n\n|\n\[!|$)/g, (match) => {
                const index = multiLineBlocks.length;
                multiLineBlocks.push(match);
                return `__MULTILINE_BLOCK_${index}__`;
            });
            console.log('✅ 多行块处理完成，共找到', multiLineBlocks.length, '个多行块');

            // 第三步：处理列表（在HTML转义之前，避免内容被转义影响）
            console.log('🔍 收集列表块...');
            const listBlocks = [];

            // 收集无序列表块（连续的*列表项，支持列表项之间有空行或无空行）
            html = html.replace(/((?:^[*•-] .+(?:\n(?:\s*|\n\s*\n)[*•-] .+)*)+\n?)/gm, (match) => {
                listBlocks.push({ type: 'unordered', html: match });
                return `__LIST_BLOCK_${listBlocks.length - 1}__`;
            });

            // 收集有序列表块（连续的数字列表项，支持列表项之间有空行或无空行）
            html = html.replace(/((?:^\d+\. .+(?:\n(?:\s*|\n\s*\n)\d+\. .+)*)+\n?)/gm, (match) => {
                listBlocks.push({ type: 'ordered', html: match });
                return `__LIST_BLOCK_${listBlocks.length - 1}__`;
            });

            console.log('✅ 列表块收集完成，共', listBlocks.length, '个块');

            // 第3.5步：收集提示框块（| 前缀），在HTML转义之前
            console.log('🔍 收集提示框块...');
            const tipBoxBlocks = [];
            html = html.replace(/(^\| .+(?:\n(?!\n|```|!\[|\[!|^[#*|\-] |^\d+\. ).+)*)/gm, (match) => {
                tipBoxBlocks.push(match);
                return `__TIPBOX_BLOCK_${tipBoxBlocks.length - 1}__\n\n`;
            });
            console.log('✅ 提示框块收集完成，共', tipBoxBlocks.length, '个块');

            // 第四步：处理引用块（在转义HTML之前），用占位符保护
            console.log('🔍 处理引用块前...');
            const quoteBlocks = [];
            // 匹配引用块及其后面的所有空行（> 后不管有没有空格都匹配）
            const quoteRegex = /((?:^>.*$\n?)+)(\n*)/gm;
            // 先收集所有匹配，避免 exec + replace 导致 lastIndex 错位
            const quoteMatches = [...html.matchAll(quoteRegex)];
            quoteMatches.forEach((match) => {
                quoteBlocks.push({
                    content: match[1]
                });
            });
            // 从后往前替换，避免位置偏移
            for (let i = quoteMatches.length - 1; i >= 0; i--) {
                const m = quoteMatches[i];
                html = html.substring(0, m.index) + `__QUOTE_BLOCK_${i}__\n\n` + html.substring(m.index + m[0].length);
            }
            console.log('✅ 引用块处理完成，共找到', quoteBlocks.length, '个引用块');

            // 第五步：处理行内代码（在转义HTML之前）- 使用临时对象存储
            const inlineCodes = [];
            html = html.replace(/`([^`]+)`/g, (match, code) => {
                const index = inlineCodes.length;
                inlineCodes.push(code);

            // H4 - 四级标题
            html = html.replace(/^#### (.+)$/gm, (match, title) => {

            // H5 - 五级标题
            html = html.replace(/^##### (.+)$/gm, (match, title) => {
                if (theme === 'chunmu') {

                const content = numMatch ? `<span style="color: ${t.boldColor};">${numMatch[1]}</span><span style="color: ${t.text};">${numMatch[2]}</span>` : `<span style="color: ${t.text};">${title}</span>`;
                return `<section style="margin-top: 35px !important; padding-top: 30px; border-top: ${t.headingBorderWidth} solid ${t.headingBorder}; margin-bottom: 12px !important;"><span style="font-size: 14px; font-weight: 600;">${content}</span></section>`;
            });

            // H6 - 六级标题
            html = html.replace(/^###### (.+)$/gm, (match, title) => {
                if (theme === 'chunmu') {
                    return `<section style="margin: 16px 0 6px;"><section style="font-size: 14px; font-weight: 600; color: #4A3B32; line-height: 1.4;">${renderTitleNum(title, '#4A3B32')}</section></section>`;

                return `<section style="margin-top: 35px !important; padding-top: 30px; border-top: ${t.headingBorderWidth} solid ${t.headingBorder}; margin-bottom: 10px !important;"><span style="font-size: 13px; font-weight: 600;">${content}</span></section>`;
            });

            // 粗体/斜体处理暂时移除，避免冲突

            // 图片（必须在链接之前处理，否则链接正则会吃掉图片语法）
            const imageCorner = document.getElementById('image-corner')?.value || '8px';
            html = html.replace(/!\[([^\]]*)\]\(([^\)]+)\)/g, (match, alt, src) => {
                if (theme === 'chunmu') {
                    let imgHtml = `<section style="margin: 15px 0; text-align: center;"><img src="${src}" alt="${alt}" style="max-width: 100%; height: auto; border-radius: 4px;">`;
                    if (alt) {
                        // 编码冒号防止被 URL 自动识别正则匹配
                        const safeAlt = alt.replace(/:/g, '&#58;');
                        imgHtml += `<section style="font-size: 12px; color: #8c8c8c; text-align: center; margin-top: 8px;">${safeAlt}</section>`;
                    }
                    imgHtml += `</section>`;
                    return imgHtml;
                }
                return `<img src="${src}" alt="${alt}" style="max-width: 100%; height: auto; border-radius: ${imageCorner}; margin: 25px 0 0 0;">`;
            });

            // 链接（微信公众号不支持<a>外链，改为文字+脚注形式）
            html = html.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, (match, text, url) => {
                // 微信内部链接（如 #idf 格式的锚点）保留
                if (url.startsWith('#')) {
                    return text;
                }
                return `<span style="color: ${t.accent}; text-decoration: underline;">${text}</span>`;
            });

            // URL 自动识别（http/https 开头的裸链接）
            html = html.replace(/(?<!["\(=])(https?:\/\/[^\s<>\)]+)/g, (match, url) => {
                if (theme === 'chunmu') {
                    return `<span style="font-family: 'Menlo', Monaco, Consolas, 'Courier New', monospace; font-size: 14px; background-color: #f5f5f5; padding: 2px 6px; border-radius: 3px; color: #1F6E43; word-break: break-all;">${url}</span>`;
                }
                return `<span style="font-family: 'Menlo', Monaco, Consolas, 'Courier New', monospace; font-size: 14px; background-color: #f5f5f5; padding: 2px 6px; border-radius: 3px; color: #d14; word-break: break-all;">${url}</span>`;
            });

            // 分隔线 - 实线全宽
            html = html.replace(/^\s*---+\s*$/gm, (match) => {
                if (theme === 'chunmu') {
                    return `<section style="margin: 30px 0;"><section style="border-top: 1px solid #eee;"></section></section>`;
                }
                return `<section style="margin: 40px 0;"><section style="border-top: 1px solid ${t.headingBorder};"></section></section>`;
            });
            html = html.replace(/^\s*\*\*\*+\s*$/gm, `<section style="margin: 40px 0;"><section style="border-top: 1px solid ${t.headingBorder};"></section></section>`);
            html = html.replace(/^\s*___+\s*$/gm, `<section style="margin: 40px 0;"><section style="border-top: 1px solid ${t.headingBorder};"></section></section>`);

            // 段落处理 - 简单方法：按行处理
            console.log('🔍 段落处理前...');

            const lines = html.split('\n');
            const result = [];
            let inListBlock = false;
            let listBlockSpacing = '0px';

            lines.forEach((line, index) => {
                const trimmed = line.trim();

                // 跳过空行
                if (!trimmed) return;

                // 检查是否是已处理的HTML块或占位符
                if (trimmed.startsWith('<h') || trimmed.startsWith('<blockquote') || trimmed.startsWith('<pre') ||
                    trimmed.startsWith('<hr') || trimmed.startsWith('<section') ||
                    trimmed.startsWith('<img') ||
                    (trimmed.startsWith('<div') && (trimmed.includes('display: flex') || trimmed.includes('border-bottom'))) ||
                    trimmed.startsWith('__MULTILINE_BLOCK_') || trimmed.startsWith('__LIST_BLOCK_')) {

                    // 列表项
                    if (trimmed.startsWith('<div') && trimmed.includes('display: flex')) {
                        if (!inListBlock) {
                            inListBlock = true;
                            listBlockSpacing = (result.length > 0) ? '25px' : '0px';
                        }
                        result.push(trimmed);
                    } else {
                        inListBlock = false;
                        result.push(trimmed);
                    }
                    return;
                }

                // 普通文本段落 - 处理粗体/斜体
                inListBlock = false;
                const marginTop = (result.length > 0) ? t.paragraphMargin : '0px';

                // 处理粗体/斜体（使用参考样式）
                let styledContent = trimmed;
                styledContent = styledContent.replace(/\*\*\*([^*\n]+)\*\*\*/g, `<strong style="font-weight: 700; color: ${t.boldColor}; ${boldExtra}"><em>$1</em></strong>`);
                styledContent = styledContent.replace(/\*\*([^*\n]+)\*\*/g, `<strong style="font-weight: 700; color: ${t.boldColor}; ${boldExtra}">$1</strong>`);
                styledContent = styledContent.replace(/___([^_\n]+)___/g, `<strong><em>$1</em></strong>`);
                styledContent = styledContent.replace(/__([^_\n]+)__/g, `<strong>$1</strong>`);
                styledContent = styledContent.replace(/\*([^*\n]+)\*/g, `<em>$1</em>`);
                styledContent = styledContent.replace(/_([^_\n]+)_/g, `<em>$1</em>`);

                // 加色处理（==text== → 红色文字，在高亮之前处理以支持 ++==嵌套==++）
                styledContent = styledContent.replace(/==([^=\n]+)==/g, `<span style="color: ${t.highlightText};">$1</span>`);
                // 高亮处理（++text++ → 红字粉底等宽）
                styledContent = styledContent.replace(/\+\+([^\+\n]+)\+\+/g, `<span style="color: ${t.highlightBgText}; background-color: ${t.highlightBg}; padding: 0.2em 0.5em; border-radius: 4px; font-size: 14px; line-height: 1.4; font-family: 'Menlo', Monaco, Consolas, 'Courier New', monospace; margin: 0 2px; display: inline-flex; align-items: center; justify-content: center; box-decoration-break: clone; -webkit-box-decoration-break: clone;">$1</span>`);

                result.push(`<p style="margin: ${marginTop} 0 0 0 !important;"><span style="font-size: ${t.baseFontSize}; line-height: ${t.lineHeight}; color: ${t.text}; text-align: justify; font-family: ${t.fontFamily}; display: block;">${styledContent}</span></p>`);
            });

            html = result.join('');

            console.log('✅ 段落处理完成');

            // 恢复列表块
            console.log('🔍 恢复列表块...');
            listBlocks.forEach((block, index) => {
                const placeholder = `__LIST_BLOCK_${index}__`;
                const lines = block.html.trim().split('\n').filter(line => line.trim());

                // 第一个列表项加25px上边距，其他列表项加10px上边距
                // 使用section包裹确保微信兼容
                const itemsHtml = lines.map((line, itemIndex) => {
                    let content = line.replace(/^[*•-] \s*|^\d+\. \s*/, '');

                    // 处理粗体/斜体（大聪明风格）
                    content = content.replace(/\*\*\*([^*\n]+)\*\*\*/g, `<strong style="font-weight: 700; color: ${t.boldColor}; ${boldExtra}"><em>$1</em></strong>`);
                    content = content.replace(/\*\*([^*\n]+)\*\*/g, `<strong style="font-weight: 700; color: ${t.boldColor}; ${boldExtra}">$1</strong>`);
                    content = content.replace(/___([^_\n]+)___/g, `<strong><em>$1</em></strong>`);
                    content = content.replace(/__([^_\n]+)__/g, `<strong>$1</strong>`);
                    content = content.replace(/\*([^*\n]+)\*/g, `<em>$1</em>`);
                    content = content.replace(/_([^_\n]+)_/g, `<em>$1</em>`);

                    // 加色处理
                    content = content.replace(/==([^=\n]+)==/g, `<span style="color: ${t.highlightText};">$1</span>`);
                    // 高亮处理
                    content = content.replace(/\+\+([^\+\n]+)\+\+/g, `<span style="color: ${t.highlightBgText}; background-color: ${t.highlightBg}; padding: 0.2em 0.5em; border-radius: 4px; font-size: 14px; line-height: 1.4; font-family: 'Menlo', Monaco, Consolas, 'Courier New', monospace; margin: 0 2px; display: inline-flex; align-items: center; justify-content: center; box-decoration-break: clone; -webkit-box-decoration-break: clone;">$1</span>`);

                    const isFirst = itemIndex === 0;
                    const isLast = itemIndex === lines.length - 1;
                    let wrapperStyle;

                    if (isFirst && isLast) {
                        // 只有一项：上边距25px，下边距25px
                        wrapperStyle = 'margin: 25px 0 25px 0 !important;';
                    } else if (isFirst) {
                        // 第一项：上边距25px，加分隔线
                        wrapperStyle = 'margin: 25px 0 0 0 !important; padding-bottom: 5px; border-bottom: 1px solid ' + t.listBorder + ';';
                    } else if (isLast) {
                        // 最后一项：上边距5px，下边距25px
                        wrapperStyle = 'margin: 5px 0 25px 0 !important;';
                    } else {
                        // 中间项：上边距5px，加分隔线
                        wrapperStyle = 'margin: 5px 0 0 0 !important; padding-bottom: 5px; border-bottom: 1px solid ' + t.listBorder + ';';
                    }

                    if (block.type === 'ordered') {
                        const numMatch = line.match(/^(\d+)\./);
                        const num = numMatch ? parseInt(numMatch[1]) : (itemIndex + 1);
                        if (theme === 'chunmu') {
                            const isLastItem = itemIndex === lines.length - 1;
                            const chunmuOrderedStyle = isFirst ? 'margin: 15px 0 0 0;' : isLastItem ? 'margin: 0 0 15px 0;' : 'margin: 18px 0 0 0;';
                            return `<section style="${chunmuOrderedStyle}"><span style="font-weight: 700; color: #1F6E43; font-size: 16px; margin-right: 5px;">${num}.</span><span style="color: ${t.text};">${content}</span></section>`;
                        }
                        return `<section style="${wrapperStyle}"><div style="display: flex; align-items: flex-start;"><span style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; background-color: ${t.numBg}; color: ${t.numText}; font-size: 12px; font-family: 'Menlo', Monaco, Consolas, 'Courier New', monospace; border-radius: 4px; flex-shrink: 0; margin-right: 10px; margin-top: 4px;">${num}</span><span style="color: ${t.text}; line-height: 1.7; font-size: 14px; flex: 1; min-width: 0;">${content}</span></div></section>`;
                    } else {
                        if (theme === 'chunmu') {
                            const chunmuWrapperStyle = isFirst && isLast
                                ? 'padding: 16px 0; margin: 0 0 0 0;'
                                : isFirst ? 'padding: 16px 0; border-bottom: 1px dashed #E8E3D9; margin: 0 0 0 0;'
                                : isLast ? 'padding: 16px 0; margin: 0;'
                                : 'padding: 16px 0; border-bottom: 1px dashed #E8E3D9; margin: 0;';
                            return `<section style="${chunmuWrapperStyle}"><div style="display: flex; align-items: flex-start; gap: 12px;"><span style="color: #1F6E43; font-size: 10px; margin-top: 6px; flex-shrink: 0;">■</span><span style="color: ${t.text}; font-size: 14.5px; line-height: 1.625; flex: 1; min-width: 0;">${content}</span></div></section>`;
                        }
                        return `<section style="${wrapperStyle}"><div style="display: flex; align-items: baseline;"><span style="color: ${t.bulletColor}; font-size: 14px; line-height: 1; margin-right: 8px; flex-shrink: 0;">${t.bulletChar}</span><span style="color: ${t.text}; line-height: 1.7; font-size: 14px; flex: 1; min-width: 0;">${content}</span></div></section>`;
                    }
                }).join('');

                html = html.replaceAll(placeholder, itemsHtml);
            });
            console.log('✅ 列表块恢复完成');

            // 全局加色处理（==text== → 红色文字，先处理以支持 ++==嵌套==++）
            html = html.replace(/==([^=\n]+)==/g, `<span style="color: ${t.highlightText};">$1</span>`);

            // 全局高亮处理（++text++ → 红字粉底等宽）
            html = html.replace(/\+\+([^\+\n]+)\+\+/g, `<span style="color: ${t.highlightBgText}; background-color: ${t.highlightBg}; padding: 0.2em 0.5em; border-radius: 4px; font-size: 14px; line-height: 1.4; font-family: 'Menlo', Monaco, Consolas, 'Courier New', monospace; margin: 0 2px; display: inline-flex; align-items: center; justify-content: center; box-decoration-break: clone; -webkit-box-decoration-break: clone;">$1</span>`);

            // 盘古之白：中文与英文/数字之间自动加空格（不影响有序列表序号）
            html = html.replace(/>([^<]+)</g, (match, text) => {
                let spaced = text;
                spaced = spaced.replace(/([\u4e00-\u9fa5])([a-zA-Z0-9])/g, '$1 $2');
                spaced = spaced.replace(/([a-zA-Z0-9])([\u4e00-\u9fa5])/g, '$1 $2');
                return `>${spaced}<`;
            });

            return html;
        }

        // 简单的代码高亮
        function highlightCode(code, theme) {
            const t = themes[theme];
            let result = code;

            // 关键字
            const keywords = ['function', 'const', 'let', 'var', 'if', 'else', 'for', 'while', 'return', 'import', 'export', 'class', 'new', 'this', 'async', 'await', 'try', 'catch', 'throw', 'default', 'from', 'typeof', 'instanceof'];
            keywords.forEach(kw => {
                const regex = new RegExp(`\\b(${kw})\\b`, 'g');
                result = result.replace(regex, `<span style="color: #c678dd;">${kw}</span>`);
            });

            // 字符串
            result = result.replace(/(["'`])(?:(?!\1)[^\\]|\\.)*?\1/g, '<span style="color: #98c379;">$&</span>');

            // 注释
            result = result.replace(/(\/\/.*$)/gm, '<span style="color: #5c6370;">$1</span>');
            result = result.replace(/(\/\*[\s\S]*?\*\/)/g, '<span style="color: #5c6370;">$1</span>');

            // 数字
            result = result.replace(/\b(\d+\.?\d*)\b/g, '<span style="color: #d19a66;">$1</span>');

            // 函数调用
            result = result.replace(/\b([a-zA-Z_]\w*)\s*\(/g, '<span style="color: #61afef;">$1</span>(');

            return result;
        }

        // 生成完整的 HTML
        async function generateHTML(markdown, theme, forWechat = false) {

            const t = themes[theme];

            // 移动端优化：推送/复制时使用更小的行距

                origLineHeight = t.lineHeight;

            if (forWechat) {
                t.baseFontSize = origFontSize;

            const contentStyle = `font-family: ${t.fontFamily}; font-size: ${t.baseFontSize}; line-height: ${t.lineHeight}; letter-spacing: ${t.letterSpacing !== '0' ? t.letterSpacing : '0px'}; text-align: left;`;

            const bgStyle = `background: ${t.background};`;
            // 去除第一个元素的上边距，避免顶部空白
            let contentWithoutTopMargin = content.replace(/^\s*<p style="/, '<p style="margin-top: 0 !important; ');
            const contentWrapper = `<section style="position: relative; z-index: 1; padding: 1px 15px 0 15px !important; margin-top: 0 !important;">${contentWithoutTopMargin.replace(/^\s*<p/, '<p').replace(/^<p[^>]*><\/p>\s*/gi, '')}<p style="text-align: center; margin-top: 60px; padding-top: 20px; border-top: 1px dotted ${t.endBorder}; color: ${t.endColor}; font-size: 12px; letter-spacing: 0.3em;">— END —</p></section>`;

            return `<section style="background-color: ${t.background}; padding: 0 0 32px 0; box-sizing: border-box;"><section style="${contentStyle} color: ${t.text}; max-width: 680px; margin: 0 auto !important; margin-top: 0 !important; padding-top: 0 !important;">${contentWrapper}</section></section>`;
        }

        // 推送到公众号（通过后端服务）
        async function pushToWechat() {
            const markdown = document.getElementById('markdown-input').value;
            const title = document.getElementById('article-title').value;
            const author = document.getElementById('article-author').value;
            let html = await generateHTML(markdown, currentTheme, true);

            // 根据复选框决定是否去除背景色
            const keepBackground = document.getElementById('keep-background').checked;
            if (!keepBackground) {
                // 只去除外层大背景色，保留所有装饰性背景
                // 按顺序去除，确保不会误伤其他样式
                html = html.replace(/background-color:\s*#FAFAF9\s*;?\s*/gi, '');
                html = html.replace(/background-color:\s*#F6F8FA\s*;?\s*/gi, '');
                html = html.replace(/background-color:\s*#FFF9F0\s*;?\s*/gi, '');
                // 对于 rgb() 格式，确保完整匹配整个属性
                html = html.replace(/background-color:\s*rgb\(250,\s*250,\s*250\)\s*;?\s*/gi, '');
                html = html.replace(/background-color:\s*rgb\(255,\s*255,\s*255\)\s*;?\s*/gi, '');
            }

            // 检查后端服务是否可用
            showLoadingToast('正在检查服务状态...');
            try {
                const healthResponse = await fetch(`${API_BASE}/health`, { method: 'GET' });
                if (!healthResponse.ok) {
                    throw new Error('后端服务未启动');
                }
            } catch (err) {
                hideToast();
                setTimeout(() => showToast('请先启动后端服务：npm start', 'error'), 100);
                return;
            }

            try {
                showLoadingToast('正在推送到公众号...');

                const response = await fetch(`${API_BASE}/api/wechat/draft`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: title,
                        author: author,
                        digest: markdown.substring(0, 120).replace(/[#*`>\-]/g, '').trim(),
                        content: html
                    })
                });

                const result = await response.json();

                hideToast();

                if (result.error) {
                    setTimeout(() => showToast('推送失败：' + result.error, 'error'), 100);
                } else {
                    setTimeout(() => showToast('✅ 文章已成功推送到公众号草稿箱！', 'success'), 100);
                }
            } catch (error) {
                hideToast();
                setTimeout(() => showToast('推送失败：' + error.message, 'error'), 100);
                console.error('推送错误:', error);
            }
        }

        // 生成推送命令（备用方案）

        // 触发图片上传
        function triggerImageUpload() {
            document.getElementById('image-upload-input').click();
        }

        // 在光标位置插入文字
        function insertAtCursor(textarea, text) {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const value = textarea.value;
            textarea.value = value.substring(0, start) + text + value.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + text.length;
            textarea.focus();
        }

        // 处理图片上传
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const btn = document.getElementById('upload-image-btn');
            btn.disabled = true;
            btn.textContent = '⏳ 上传中...';

            try {
                const formData = new FormData();
                formData.append('image', file);

                const response = await fetch(`${API_BASE}/api/wechat/upload-image`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.error) {
                    showToast('上传失败：' + result.error, 'error');
                } else {
                    const textarea = document.getElementById('markdown-input');
                    insertAtCursor(textarea, `\n![](${result.url})\n`);
                    updatePreview();
                    showToast('图片上传成功！');
                }
            } catch (error) {
                showToast('上传失败：' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '📷 上传图片';
                event.target.value = '';
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 图片上传事件
            document.getElementById('image-upload-input').addEventListener('change', handleImageUpload);

            const markdownInput = document.getElementById('markdown-input');

            // 粘贴图片自动上传
            markdownInput.addEventListener('paste', async (e) => {
                const items = e.clipboardData?.items;
                if (!items) return;
                for (const item of items) {
                    if (item.type.startsWith('image/')) {
                        e.preventDefault();
                        const file = item.getAsFile();
                        if (!file) continue;

                        showLoadingToast('正在上传图片...');
                        try {
                            const formData = new FormData();
                            formData.append('image', file);
                            const response = await fetch(`${API_BASE}/api/wechat/upload-image`, {
                                method: 'POST',
                                body: formData
                            });
                            const result = await response.json();
                            hideToast();
                            if (result.error) {
                                showToast('上传失败：' + result.error, 'error');
                            } else {

                            hideToast();
                            showToast('上传失败：' + error.message, 'error');
                        }
                        break;

            authorInput.addEventListener('input', updatePreview);

                const btn = e.target.closest('.theme-btn');
                if (btn) {
                    switchTheme(btn.dataset.theme);
                }
            });

            // 初始预览
            updatePreview();

            // 同步滚动
            const editor = markdownInput;
            const previewContent = document.getElementById('preview-panel-content');
            let syncScrollLock = false;

            editor.addEventListener('scroll', () => {
                if (syncScrollLock) return;
                syncScrollLock = true;
                const editorMax = editor.scrollHeight - editor.clientHeight;
                const ratio = editorMax > 0 ? editor.scrollTop / editorMax : 0;
                previewContent.scrollTop = ratio * (previewContent.scrollHeight - previewContent.clientHeight);
                requestAnimationFrame(() => { syncScrollLock = false; });
            });

            previewContent.addEventListener('scroll', () => {
                if (syncScrollLock) return;
                syncScrollLock = true;
                const previewMax = previewContent.scrollHeight - previewContent.clientHeight;
                const ratio = previewMax > 0 ? previewContent.scrollTop / previewMax : 0;
                editor.scrollTop = ratio * (editor.scrollHeight - editor.clientHeight);
                requestAnimationFrame(() => { syncScrollLock = false; });
            });
        });
    </script>
